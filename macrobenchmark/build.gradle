plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.baselineprofile'
}

android {
    namespace 'com.reelfocus.app.macrobenchmark'
    compileSdk 35

    defaultConfig {
        minSdk 28
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    targetProjectPath = ':app'

    // Keep Java and Kotlin bytecode targets aligned with the app module.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.2.3'
    implementation 'androidx.test.ext:junit:1.1.5'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

baselineProfile {
    // This is the producer module. Automatic generation is configured on the
    // consuming app module, not on the baseline profile producer.
    useConnectedDevices = true
}